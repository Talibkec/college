spring.mvc.view.prefix:/WEB-INF/
spring.mvc.view.suffix:.jsp
spring.thymeleaf.view-names:thymeleaf/*

#server.port=80

spring.thymeleaf.cache=false
#    5am every day
purge.cron.expression=0 0 5 * * ?

# Never let Hibernate change the (production) schema. Was "update" before the upgrade (approved change 2026-10-15).

spring.jpa.hibernate.ddl-auto=none
# Entity IDs are GenerationType.IDENTITY (MySQL AUTO_INCREMENT), same as before the upgrade.
