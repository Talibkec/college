spring.mvc.view.prefix:/WEB-INF/
spring.mvc.view.suffix:.jsp
spring.thymeleaf.view-names:thymeleaf/*

#server.port=80

spring.thymeleaf.cache=false
#    5am every day
purge.cron.expression=0 0 5 * * ?

# Never let Hibernate change the (production) schema. Was "update" before the upgrade (approved change 2026-10-15).

spring.jpa.hibernate.ddl-auto=none
# Keep Hibernate's pre-5.x ID mapping (GenerationType.AUTO -> MySQL AUTO_INCREMENT). Boot 2 default would use
# hibernate_sequence tables. Replaced by explicit IDENTITY on the entities in the Boot 3 stage.
spring.jpa.hibernate.use-new-id-generator-mappings=false
