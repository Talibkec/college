spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/keckacin_college2}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
# Hibernate 6+ detects the MySQL dialect/version from the connection (explicit dialect removed).
spring.jpa.properties.hibernate.format_sql = true
# Boot 2+ uses HikariCP, which validates connections itself (the old tomcat-jdbc testWhileIdle/validationQuery keys no longer apply).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Uploads: commons-fileupload (no limit) was replaced by standard servlet multipart (default 1MB) - approved limits.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=800000000000
